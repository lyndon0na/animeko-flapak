name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder

      - name: Install the GNOME runtime and SDK from Flathub
        run: |
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//49 org.gnome.Sdk//49

      # rofiles-fuse buys nothing here: the module only unpacks and copies
      # prebuilt files, it never compiles anything.
      - name: Build and install
        run: |
          flatpak-builder --user --install --force-clean --disable-rofiles-fuse \
            --repo=repo build me.him188.ani.yaml

      - name: Verify the packaged tree
        run: |
          set -euo pipefail
          app="$HOME/.local/share/flatpak/app/me.him188.ani/current/active/files"
          cfg="$app/ani/usr/lib/app/Ani.cfg"
          jar="$app/ani/usr/lib/app/animeko-bootstrap.jar"
          manifest="$RUNNER_TEMP/manifest.txt"

          test -x "$app/ani/usr/bin/Ani"
          test -f "$jar"

          # The launcher must see exactly one classpath entry pointing at the
          # bootstrap jar, otherwise it truncates the classpath and dies in
          # setenv() before the JVM starts.
          test "$(grep -c '^app.classpath=' "$cfg")" = "1"
          grep -q '^app.classpath=\$APPDIR/animeko-bootstrap.jar$' "$cfg"

          unzip -p "$jar" META-INF/MANIFEST.MF > "$manifest"
          grep -q '^Class-Path: ' "$manifest"
          grep -q 'desktop-6.1.0.jar' "$manifest"
          grep -q '^Main-Class: me.him188.ani.app.desktop.AniDesktop' "$manifest"

          for size in 128 256 512; do
            test -f "$app/share/icons/hicolor/${size}x${size}/apps/me.him188.ani.png"
          done
          echo "packaged tree ok"

      # The runner has no display. Xvfb is enough for the app to log its
      # subsystem status, which catches a broken bundle. Best effort: this step
      # reports but does not fail the build.
      #
      # Every layer here is hard-bounded on purpose. Killing `flatpak run` leaves
      # the sandbox's own processes alive, and dbus-run-session then waits for
      # its bus to drain, so without a kill-based timeout the step never returns
      # and the release step behind it never runs.
      - name: Smoke test under Xvfb
        continue-on-error: true
        timeout-minutes: 6
        run: |
          sudo apt-get install -y --no-install-recommends xvfb dbus-x11
          log="$RUNNER_TEMP/ani.log"
          timeout --signal=KILL 180 dbus-run-session -- xvfb-run -a \
            --server-args='-screen 0 1280x800x24' \
            flatpak run me.him188.ani >"$log" 2>&1 || true
          flatpak kill me.him188.ani 2>/dev/null || true
          echo "--- last 40 lines ---"
          tail -40 "$log"
          grep -q 'Ani started' "$log"
          grep -q 'mediampv is loaded' "$log"
          grep -q 'JCEF is initialized' "$log"

      - name: Export the bundle
        id: bundle
        run: |
          set -euo pipefail
          version="$(grep -oE 'releases/download/v[0-9.]+' me.him188.ani.yaml | head -1 | sed 's|.*/v||')"
          name="animeko-${version}-x86_64.flatpak"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          flatpak build-bundle repo "$name" me.him188.ani
          ls -l "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: ${{ steps.bundle.outputs.name }}
          if-no-files-found: error

      # Every successful build publishes, so a push to main is enough to get a
      # downloadable bundle. The release tag is derived from the version pinned
      # in the manifest, so runs that do not bump that version refresh the same
      # release (the asset is replaced), and bumping it creates a new one.
      #
      # `--target` is ignored by GitHub when the tag already exists, so passing
      # it unconditionally is safe for tag pushes too.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.bundle.outputs.version }}"
          asset="${{ steps.bundle.outputs.name }}"
          tag="v${version}"
          notes="$RUNNER_TEMP/release-notes.md"

          {
            echo "Animeko ${version} repackaged as a Flatpak for x86_64, built from the"
            echo "AppImage published by [open-ani/animeko](https://github.com/open-ani/animeko)."
            echo
            echo "Install with:"
            echo
            echo '```'
            echo "curl -LO ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/latest/download/${asset}"
            echo "flatpak install --user ./${asset}"
            echo '```'
            echo
            echo "Requires org.gnome.Platform 49."
            echo
            echo "Built from \`${GITHUB_SHA}\` on ${GITHUB_REF_NAME}."
          } > "$notes"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "Animeko ${version} (Flatpak)" --notes-file "$notes"
          else
            # Keep the "built from" note current when an existing release is
            # refreshed rather than created.
            gh release edit "$tag" --notes-file "$notes"
          fi
          gh release upload "$tag" "$asset" --clobber
          echo "published: $(gh release view "$tag" --json url --jq .url)"
